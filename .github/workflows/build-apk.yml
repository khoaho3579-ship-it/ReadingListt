name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen du an
        run: unzip -q ReadingList.zip
      - name: Them plugin Compose Compiler
        working-directory: ReadingList
        run: |
          sed -i 's|id("com.google.devtools.ksp") version "2.0.21-1.0.26" apply false|&\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false|' build.gradle.kts
          sed -i 's|^    id("com.google.devtools.ksp")$|&\n    id("org.jetbrains.kotlin.plugin.compose")|' app/build.gradle.kts
          cat build.gradle.kts
          head -8 app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cai Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Tao keystore
        working-directory: ReadingList
        run: |
          keytool -genkeypair -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass freddyrelease -keypass freddyrelease \
            -dname "CN=ReadingList, OU=Freddy, O=Freddy, C=US"
      - name: Build APK
        working-directory: ReadingList
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ReadingList-apk
          path: ReadingList/app/build/outputs/apk/release/app-release.apk
